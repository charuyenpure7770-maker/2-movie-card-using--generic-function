         <div class="movieModel" id="movieModel">
            <form id="form">
            <div class="card">
               <div class="card-header d-flex justify-content-between">
                   <h3 class="m-0">Add Movie Details</h3>
                   <i class="fa-solid fa-xmark fa-2x" role="button" id="icon"></i>
               </div>
               <div class="card-body py-0">
                  <label for="name">Movie Name:-</label>
                  <input type="text" class="form-control" id="name" required>

                  <label for="image">Movie Image:-</label>
                  <input type="text" class="form-control" id="image" required>
                    <div class="row">
                        <div class="col-6">

                   <label for="gnare">Genre:-</label>
                   
                  <select  class="form-control" id="gnare" required>
                    <option value="" disabled>Select Genre</option>
                    <option value="sci-fi">Sci-Fi</option>
                    <option value="action">Action</option>
                    <option value="drama">Drama</option>
                    <option value="horror">Horror</option>
                  </select>

                        </div>
                        <div class="col-6">
                            <label for="image">Created At:-</label>
                            <input type="date" class="form-control" id="createdAt" required>
                        </div>
                    </div>
                  <label for="name">Description:-</label>
                  <textarea name="" class="form-control" id="discription" rows="3" required></textarea>
                   
                  <label for="name">Rating:-</label>
                  <select  class="form-control" id="rating" required>
                     <option value=""selected disabled>Select Rating</option>
                     <option value="1">1</option>
                     <option value="2">2</option>
                     <option value="3">3</option>
                     <option value="4">4</option>
                     <option value="5">5</option>
                  </select>
               </div>
               <div class="card-footer d-flex justify-content-between">
                    <button type ="submit" class="btn btn-sm netflix-sec-color" id="addMovie">Add Movie</button>
                    <button type ="button" class="btn btn-sm netflix-sec-color d-none" id="updateMovie">Update Movie</button>
                    <button type ="button" class="btn btn-sm netflix-pri-Color" id="closeBtn">Close</button>
                 </div>
               </form>
            </div>
    </div>
    <div class="spinner d-none" id="spinner">
  <div class="spinner-border" role="status">
    <span class="sr-only">Loading...</span>
  </div>
